openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tiktok/stats:
    get:
      operationId: getTiktokStats
      tags: [community]
      summary: Get the latest TikTok follower count
      description: Returns a live follower count when available, or the last verified count as a stale fallback.
      responses:
        "200":
          description: TikTok follower snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TiktokStatsResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TiktokStatsResponse:
      type: object
      properties:
        followers:
          type: integer
          minimum: 0
        fetchedAt:
          type: string
          format: date-time
        source:
          type: string
          enum:
            - tiktok-public-profile
            - last-verified-tiktok-profile
        stale:
          type: boolean
      required:
        - followers
        - fetchedAt
        - source
        - stale

